# Despliegue de la API en el servidor.
#
# El servidor ya corre Caddy (como servicio del sistema, no en docker) y
# un PostgreSQL en docker de otro proyecto. Este compose agrega solamente
# la API: publica el puerto en 127.0.0.1, donde solo llega Caddy, y se
# une a la red de la base para usar su propia base "stockarg".

services:
  api:
    build:
      context: ../backend
    image: stockarg-api:${VERSION:-actual}
    container_name: stockarg-api
    restart: unless-stopped
    env_file: ../backend/.env
    ports:
      # Nunca 0.0.0.0: la API no queda expuesta sin pasar por Caddy.
      - "127.0.0.1:${PUERTO_LOCAL:-8002}:8000"
    networks:
      - datos
    # El host tiene 1 GB y lo comparte: un tope evita que un pico de la
    # API deje sin memoria a los otros proyectos.
    mem_limit: 320m
    healthcheck:
      # El contenedor no trae curl. Python ya esta adentro.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # La red donde vive el PostgreSQL del servidor. El nombre se pasa por
  # entorno para no fijar aca el del otro proyecto.
  datos:
    external: true
    name: ${RED_DE_LA_BASE:-data-center_default}
