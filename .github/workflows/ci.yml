name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: Formato y estilo
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Tipos
        run: mypy

      - name: Pruebas
        # La suite corre sin contenedores ni base externa (RNF-10).
        run: pytest

      - name: La migracion aplica sobre una base vacia
        env:
          SECRET_KEY: clave-solo-para-la-verificacion-de-ci
          DATABASE_URL: sqlite+pysqlite:///./ci.sqlite
        working-directory: backend
        run: alembic upgrade head

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest

    # Produccion corre sobre PostgreSQL. La suite corre en SQLite, que no
    # puede confirmar los indices parciales, la cascada, el bloqueo de
    # filas ni las fechas con zona: eso se prueba aca.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: stockarg
          POSTGRES_PASSWORD: stockarg
          POSTGRES_DB: stockarg_pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockarg -d stockarg_pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: clave-solo-para-la-verificacion-de-ci
      DATABASE_URL: postgresql+psycopg://stockarg:stockarg@localhost:5432/stockarg_pruebas
      DATABASE_URL_PRUEBAS: postgresql+psycopg://stockarg:stockarg@localhost:5432/stockarg_pruebas

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: Las migraciones aplican y son reversibles
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Pruebas contra PostgreSQL
        run: pytest -m postgres

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Estilo
        run: npm run lint

      # El build de Next corre TypeScript: si un tipo no cierra, falla.
      - name: Compila y chequea tipos
        run: npm run build

  imagen:
    name: La imagen de la API compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # La imagen es lo que corre en produccion. Sin este paso, un
      # Dockerfile roto solo se descubre al desplegar.
      - name: Construir la imagen
        run: docker build backend/

  secretos:
    name: Sin secretos en la historia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Escaneo con gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
